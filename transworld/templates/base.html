<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Transworld Courier{% endblock %}</title>

    <style>
        .back-btn{
            position:fixed;
            top:15px;
            left:15px;
            background:#003973;
            color:white;
            border:none;
            padding:10px 18px;
            border-radius:6px;
            cursor:pointer;
            z-index:999;
            font-size:14px;
        }
        .back-btn:hover{
            background:#002a52;
        }
    </style>
</head>
<body>

<!-- BACK BUTTON (ALL PAGES) -->
<button onclick="history.back()" class="back-btn">⬅ Back</button>

<!-- PAGE CONTENT -->
{% block content %}
{% endblock %}

</body>
</html>
