{% extends 'base.html' %}

{% block title %}AboutUs{% endblock %}

{% block  content %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UPI Payment</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }

    .upi-card{
      background:white;
      width:350px;
      padding:30px;
      border-radius:15px;
      text-align:center;
      box-shadow:0 15px 30px rgba(0,0,0,0.2);
      animation: pop 0.6s ease;
    }

    @keyframes pop{
      from{
        transform:scale(0.8);
        opacity:0;
      }
      to{
        transform:scale(1);
        opacity:1;
      }
    }

    .upi-icon{
      font-size:50px;
      margin-bottom:10px;
    }

    h2{
      margin:10px 0;
      color:#333;
    }

    .upi-id{
      background:#f1f5ff;
      padding:10px;
      border-radius:8px;
      margin:15px 0;
      font-weight:bold;
      color:#2b59ff;
    }

    .pay-btn{
      margin-top:15px;
      width:100%;
      padding:12px;
      font-size:16px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      color:white;
      background: linear-gradient(135deg, #667eea, #764ba2);
      transition: 0.3s;
    }

    .pay-btn:hover{
      transform:translateY(-2px);
      box-shadow:0 8px 15px rgba(0,0,0,0.2);
    }

    .note{
      font-size:12px;
      color:#666;
      margin-top:12px;
    }
  </style>

</head>

<body>

  <div class="upi-card">
    <div class="upi-icon">💸</div>
    <h2>Pay using UPI</h2>

    <div class="upi-id">
      example@upi
    </div>

    <button class="pay-btn">Confirm Payment</button>

    <p class="note">
      After payment, please do not refresh the page
    </p>
  </div>

</body>
</html>

{%  endblock %}
