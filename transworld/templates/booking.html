{% extends 'base.html' %}

{% block title %}AboutUs{% endblock %}

{% block  content %}
<!DOCTYPE html>
<html>
<head>
<title>Booking</title>
<style>
    body{
             margin: 0;
             font-family: 'Montserrat', sans-serif;
             overflow: hidden;
             background: linear-gradient(135deg, #ffffff, #2e4074, #fafafa, #2e4074, #ffffff, #2e4074);
             background-size: 400% 400%;
             animation: gradientAnimation 15s ease infinite;
             display: flex;
             justify-content: center;
             align-items: center;
             min-height: 100vh;

}
.box{
    width:420px;
    background:white;
    padding:25px;
    margin:40px auto;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}
input, button{
    width:100%;
    padding:10px;
    margin:8px 0;
}
button{
    background:#2980b9;
    color:white;
    border:none;
    border-radius:5px;
    font-size:16px;
}
</style>
</head>

<body>
<div class="box">
<h2>Courier Booking</h2>

<form method="POST" enctype="multipart/form-data">
{% csrf_token %}

<input type="text" name="name" placeholder="Full Name" required>
<input type="email" name="email" placeholder="Email" required>

<input type="text" name="mobile" placeholder="Mobile Number" maxlength="10" required>

<input type="text" name="aadhar" placeholder="Aadhar Number" maxlength="12" required>

<label>Aadhar Card Photo</label>
<input type="file" name="aadhar_photo" accept="image/*" required>

<input type="text" name="pickup" placeholder="Pickup Location" required>
<input type="text" name="drop" placeholder="Drop Location" required>


<button type="submit">Book Now</button>
</form>

</div>
</body>
</html>
{%  endblock %}
