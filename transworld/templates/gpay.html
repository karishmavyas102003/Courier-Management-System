<!DOCTYPE html>
<html>
<head>
    <title>Google Pay</title>
</head>
 <style>
          body {
              margin: 0;
             font-family: 'Montserrat', sans-serif;
             overflow: hidden;
             background: linear-gradient(135deg, #ffffff, #2e4074, #fafafa, #2e4074, #ffffff, #2e4074);
             background-size: 400% 400%;
             animation: gradientAnimation 15s ease infinite;
             display: flex;
             justify-content: center;
             align-items: center;
             min-height: 100vh;

        }
        .box {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }
        button {
            padding: 10px 20px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover {
            background: #15803d;
        }
    </style>
<body>
    <h2>Google Pay</h2>
    <p>Pay using Google Pay</p>
</body>
</html>
